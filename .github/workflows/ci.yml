name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: abcfinance
          POSTGRES_PASSWORD: abcfinance
          POSTGRES_DB: abcfinance
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U abcfinance" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://abcfinance:abcfinance@127.0.0.1:5433/abcfinance
      TEST_DATABASE_URL: postgres://abcfinance:abcfinance@127.0.0.1:5433/abcfinance_test
      APP_SECRET: ${{ secrets.CI_APP_SECRET || 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE abcfinance_test WITH ENCODING 'UTF8' TEMPLATE template0"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - name: Browser for the calculator smoke test
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - name: Acceptance checks due so far have tests
        run: pnpm tsx scripts/gen-acceptance-index.ts --check "$(cat tests/acceptance/MILESTONE)"
