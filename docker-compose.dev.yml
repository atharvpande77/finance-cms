# Local development database. Port 5433 so it does not clash with other Postgres instances.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abcfinance
      POSTGRES_PASSWORD: abcfinance
      POSTGRES_DB: abcfinance
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/dev-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abcfinance"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
