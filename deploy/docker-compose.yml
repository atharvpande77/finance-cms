# Production stack on the VPS. The host's nginx proxies to 127.0.0.1:3000 (deploy/nginx).
# Usage (from the repository root):
#   docker compose -f deploy/docker-compose.yml --env-file /etc/abcfinance/app.env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file /etc/abcfinance/app.env run --rm migrate
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: /etc/abcfinance/app.env
    environment:
      DATABASE_URL: postgres://abcfinance:${POSTGRES_PASSWORD}@db:5432/abcfinance
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:3000:3000" # never public: only nginx may reach it (X-Real-IP is trusted)
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["tools"]
    env_file: /etc/abcfinance/app.env
    environment:
      DATABASE_URL: postgres://abcfinance:${POSTGRES_PASSWORD}@db:5432/abcfinance
    working_dir: /opt/tools
    command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abcfinance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: abcfinance
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abcfinance"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: reachable only from the app containers and `docker exec`.

volumes:
  pgdata:
