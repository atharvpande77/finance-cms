# Copy to /etc/nginx/snippets/abcfinance-proxy.conf
client_max_body_size 1m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

add_header Strict-Transport-Security "max-age=31536000" always;

# Build assets are content-hashed: cache for a year.
location /_next/static/ {
  proxy_pass http://abcfinance_app;
  proxy_set_header Host $host;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
  proxy_pass http://abcfinance_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $abc_connection_upgrade;
  proxy_read_timeout 60s;
}
