# abcfinance behind the host nginx. Copy to /etc/nginx/sites-available/, symlink into
# sites-enabled, replace PANEL_HOST, then `nginx -t && systemctl reload nginx`.
# Requires nginx >= 1.15.9 (variables in ssl_certificate).

upstream abcfinance_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Shared proxy settings. nginx overwrites X-Real-IP, so clients cannot forge their address.
map $http_upgrade $abc_connection_upgrade {
  default upgrade;
  ""      close;
}

# HTTP: ACME challenges for new newspaper hosts, everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# Panel host (sign-in and panels).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name PANEL_HOST;

  ssl_certificate     /etc/letsencrypt/live/PANEL_HOST/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/PANEL_HOST/privkey.pem;

  include /etc/nginx/snippets/abcfinance-proxy.conf;
}

# Every newspaper finance host. Certificates are loaded by SNI name, so adding a newspaper
# needs only `deploy/add-tenant-host.sh <host>` (no config change). Hosts the app does not
# know get a 404 from the app itself.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;

  include /etc/nginx/snippets/abcfinance-proxy.conf;
}
